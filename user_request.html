// ═══════════════════════════════════════════
// MATCHING ALGORITHM
// ═══════════════════════════════════════════
function calcMatch(pg,u){
  let s=0,reasons=[],warnings=[];
  // Budget 20%
  if(pg.rent>=u.budgetMin&&pg.rent<=u.budgetMax){s+=20;reasons.push(`Within budget: Rs.${pg.rent.toLocaleString()}/month`);}
  else if(pg.rent>u.budgetMax){const ov=pg.rent-u.budgetMax;s+=Math.max(0,20-(ov/u.budgetMax*50));warnings.push(`Over budget by Rs.${ov.toLocaleString()}`);}
  else{s+=10;reasons.push(`Below your min budget`);}
  // Sharing 15%
  if(pg.sharing===u.sharing){s+=15;reasons.push(`${pg.sharing} Sharing matches`);}
  else{warnings.push(`${pg.sharing} Sharing (you want ${u.sharing})`);}
  // Bed availability 15%
  const avail=pg.rooms.reduce((a,r)=>a+r.beds.filter(b=>b.status==='available').length,0);
  const sameRoom=pg.rooms.filter(r=>r.beds.filter(b=>b.status==='available').length>=u.people);
  if(sameRoom.length>0){s+=15;reasons.push(`${u.people} beds available in same room`);}
  else if(avail>=u.people){s+=10;reasons.push(`${avail} beds available`);warnings.push('Not all in same room');}
  else if(avail>0){s+=Math.round(avail/u.people*10);reasons.push(`${avail} bed(s) available`);warnings.push(`Need ${u.people}, only ${avail} available`);}
  else{warnings.push('No beds available');}
  // Move-in 15%
  if(avail>0){s+=15;reasons.push('Available for move-in today');}
  // Facilities 15%
  let fMatch=0;
  u.facilities.forEach(f=>{if(pg.facilities.includes(f)){fMatch++;reasons.push(`${FL[f]||f} available`);}else{warnings.push(`${FL[f]||f} not available`);}});
  s+=Math.round(fMatch/u.facilities.length*15);
  // Distance 10%
  if(pg.distance<=1)s+=10;else if(pg.distance<=2)s+=8;else if(pg.distance<=3)s+=5;else if(pg.distance<=5)s+=3;else s+=1;
  if(pg.distance<=3)reasons.push(`${pg.distance} km from your location`);
  else warnings.push(`${pg.distance} km away`);
  // Lift 5%
  if(u.liftRequired){if(pg.lift){s+=5;reasons.push('Lift available');}else{warnings.push('No lift');}}
  else s+=5;
  // Other 5%
  if(pg.verified){s+=3;reasons.push('Verified property');}
  if(pg.rating>=4)s+=2;
  return{score:Math.min(99,Math.max(5,Math.round(s))),reasons,warnings};
}

const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function openSheet(html){$('#bs-content').innerHTML=html;$('#sheet-ov').classList.add('show');$('#bsheet').classList.add('show');}
function closeSheet(){$('#sheet-ov').classList.remove('show');$('#bsheet').classList.remove('show');}
function pgImg(seed,w,h){return `https://picsum.photos/${seed}/${w}/${h}.jpg`;}
function matchColor(s){return s>=85?'var(--available)':s>=70?'var(--amber)':s>=50?'#EA580C':'var(--occupied)';}
function facilityChips(facs,size='11px'){
  return facs.map(f=>`<span style="display:inline-flex;align-items:center;gap:4px;font-size:${size};color:var(--muted);font-weight:500"><i class="fas ${FI[f]||'fa-check'}" style="font-size:${size}"></i>${FL[f]||f}</span>`).join('');
}
function getBed(pg,bedId){for(const r of pg.rooms)for(const b of r.beds)if(b.id===parseInt(bedId))return{bed:b,room:r};return null;}

// ═══════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════
function setTab(tab){
  state.tab=tab;
  $$('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.tab===tab));
  render();
}
function openSub(html){$('#sub-screen').innerHTML=html;$('#sub-screen').classList.add('show');}
function closeSub(){$('#sub-screen').classList.remove('show');$('#sub-screen').innerHTML='';}
function updateCompareFab(){
  const fab=$('#compare-fab');
  if(state.compareIds.size>=2){fab.classList.add('show');fab.innerHTML=`<i class="fas fa-columns"></i> Compare (${state.compareIds.size})`;}
  else fab.classList.remove('show');
}

function render(){
  const w=$('#scr-wrap');
  switch(state.tab){
    case 'home':w.innerHTML=renderHome();break;
    case 'search':w.innerHTML=renderSearch();break;
    case 'saved':w.innerHTML=renderSaved();break;
    case 'bookings':w.innerHTML=renderBookings();break;
    case 'profile':w.innerHTML=renderProfile();break;
  }
  updateCompareFab();
}

  const saved=state.savedIds.has(pg.id);
  return `
  <div class="card" style="padding:0">
    <div style="display:flex">
      <div style="width:110px;flex-shrink:0;position:relative">
        <img src="${pgImg(pg.images[0],220,200)}" style="width:100%;height:100%;object-fit:cover;border-radius:var(--radius) 0 0 var(--radius)" alt="${pg.name}">
        <div style="position:absolute;top:8px;left:8px;width:44px;height:44px;border-radius:50%;background:${matchColor(m.score)};display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.2)">${m.score}%</div>
      </div>
      <div style="flex:1;padding:14px 14px 14px 12px;display:flex;flex-direction:column;justify-content:space-between">
        <div>
          <div style="display:flex;align-items:start;justify-content:space-between;gap:6px">
            <div style="font-size:14.5px;font-weight:700;line-height:1.2">${pg.name}</div>
            <i class="fas ${saved?'fa-heart':'fa-heart'}" style="font-size:14px;color:${saved?'var(--occupied)':'var(--border)'};cursor:pointer;margin-top:2px" data-action="toggle-save" data-pg="${pg.id}"></i>
          </div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:3px"><i class="fas fa-location-dot" style="font-size:10px"></i> ${pg.location} &middot; ${pg.distance} km</div>
        </div>
        <div>
          <div style="display:flex;align-items:baseline;gap:6px;margin-top:8px">
            <span style="font-size:17px;font-weight:800;color:var(--fg)">Rs.${pg.rent.toLocaleString()}</span>
            <span style="font-size:11px;color:var(--muted)">/month</span>
            <span style="font-size:11px;color:var(--muted);margin-left:auto">${pg.sharing} Sharing</span>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:8px">
            ${hasToday?'<span class="badge badge-green">Available Today</span>':''}
            ${availBeds>0?`<span class="badge badge-green">${availBeds} Bed${availBeds>1?'s':''}</span>`:'<span class="badge badge-red">No Beds</span>'}
            ${pg.lift?'<span class="badge badge-green"><i class="fas fa-arrow-up" style="font-size:8px"></i> Lift</span>':''}
            ${pg.verified?'<span class="badge badge-blue"><i class="fas fa-circle-check" style="font-size:8px"></i> Verified</span>':''}
          </div>
          <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">${pg.facilities.slice(0,4).map(f=>`<span style="font-size:10.5px;color:var(--muted)"><i class="fas ${FI[f]||'fa-check'}" style="font-size:9px"></i> ${FL[f]||f}</span>`).join('')}</div>
        </div>

    </div>
    <div style="padding:0 14px 12px;display:flex;align-items:center;gap:8px">
      <label style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);cursor:pointer">

  if(!saved.length)return `<div style="padding:80px 24px;text-align:center"><i class="fas fa-heart" style="font-size:40px;color:var(--border);margin-bottom:14px"></i><div style="font-size:16px;font-weight:600;margin-bottom:4px">No saved PGs</div><div style="font-size:13px;color:var(--muted)">Tap the heart icon on any PG to save it</div></div>`;
  return `<div style="padding:20px 24px"><div style="font-size:20px;font-weight:800;margin-bottom:16px">Saved PGs</div><div style="display:flex;flex-direction:column;gap:14px">${saved.map(pg=>renderPGCard(pg)).join('')}</div></div>`;
}

function renderPGDetail(pgId){
  const pg=PGs.find(p=>p.id===parseInt(pgId));
  if(!pg)return;
  const m=pg.match;
  const availBeds=pg.rooms.reduce((a,r)=>a+r.beds.filter(b=>b.status==='available').length,0);
  const monthlyTotal=pg.rent+pg.foodCost+pg.electricityCost+pg.maintenanceCost;
  const moveInTotal=monthlyTotal+pg.deposit;
  const imgs=pg.images;
  state.photoIdx[pg.id]=state.photoIdx[pg.id]||0;
  const ci=state.photoIdx[pg.id];

  openSub(`
  <div class="sub-hdr">
    <div class="back-btn" data-action="close-sub"><i class="fas fa-arrow-left"></i></div>

    </div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:10px"><i class="fas fa-location-dot" style="font-size:11px"></i> ${pg.location} &middot; ${pg.distance} km from your location</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px">

    <!-- Cost Breakdown -->
    <div class="card" style="padding:18px;margin-bottom:18px">
      <div style="font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px"><i class="fas fa-receipt" style="color:var(--accent)"></i> Cost Breakdown</div>
